<style>
    .color-calc-container {
        background: #ffffff; color: #333; padding: 30px; border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1); font-family: 'Segoe UI', sans-serif;
        max-width: 450px; margin: 20px auto; direction: ltr; text-align: center;
    }
    .color-calc-container h2 { color: #444; margin-bottom: 20px; }
    .color-preview {
        width: 100%; height: 100px; border-radius: 10px; margin-bottom: 20px;
        border: 2px solid #eee; transition: 0.3s; background-color: #3498db;
    }
    .input-box { margin-bottom: 15px; text-align: left; }
    .input-box label { display: block; font-size: 14px; color: #666; margin-bottom: 5px; }
    .input-box input {
        width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px;
        font-size: 16px; outline: none; box-sizing: border-box;
    }
    .hex-output {
        font-size: 24px; font-weight: bold; color: #2c3e50; margin-top: 15px;
        padding: 10px; background: #f8f9fa; border-radius: 8px; display: none;
    }
</style>

<div class="color-calc-container">
    <h2>RGB to HEX Converter</h2>
    <div id="colorPreview" class="color-preview"></div>
    
    <div class="input-box">
        <label>Red (0-255):</label>
        <input type="number" id="rValue" value="52" min="0" max="255" oninput="updateColor()">
    </div>
    <div class="input-box">
        <label>Green (0-255):</label>
        <input type="number" id="gValue" value="152" min="0" max="255" oninput="updateColor()">
    </div>
    <div class="input-box">
        <label>Blue (0-255):</label>
        <input type="number" id="bValue" value="219" min="0" max="255" oninput="updateColor()">
    </div>

    <div id="hexOutput" class="hex-output">#3498db</div>
    <p style="font-size: 12px; color: #999; margin-top: 10px;">Copy the code above for your design.</p>
</div>

<script>
function componentToHex(c) {
    var hex = parseInt(c).toString(16);
    return hex.length == 1 ? "0" + hex : hex;
}

function updateColor() {
    let r = document.getElementById("rValue").value || 0;
    let g = document.getElementById("gValue").value || 0;
    let b = document.getElementById("bValue").value || 0;
    
    // تأكد من القيم بين 0 و 255
    r = Math.min(255, Math.max(0, r));
    g = Math.min(255, Math.max(0, g));
    b = Math.min(255, Math.max(0, b));

    let hex = "#" + componentToHex(r) + componentToHex(g) + componentToHex(b);
    
    document.getElementById("colorPreview").style.backgroundColor = hex;
    document.getElementById("hexOutput").innerText = hex.toUpperCase();
    document.getElementById("hexOutput").style.display = "block";
}
// لتشغيل اللون عند التحميل
updateColor();
</script>
